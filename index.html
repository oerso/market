<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Static</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ШАПКА -->
    <div class="header">
        <div class="logo">💎 Static</div>
        <div class="header-right">
            <div class="balance-pill" id="headerBalance">
                <span>+</span> 0₽
            </div>
            <button class="menu-btn" id="menuBtn">⋮</button>
        </div>
    </div>

    <!-- МЕНЮ 3 ТОЧКИ -->
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">Меню</div>
        <a class="side-item" data-page="chat">💬 Чат</a>
        <a class="side-item" data-page="reviews">⭐ Отзывы</a>
        <a class="side-item" data-page="faq">❓ FAQ</a>
        <a class="side-item" data-page="support">🆘 Поддержка</a>
        <a class="side-item" data-page="rules">📜 Информация</a>
        <a class="side-item" data-page="referral">👥 Реферальная программа</a>
    </div>
    <div class="overlay" id="overlay"></div>

    <!-- ГЛАВНЫЙ КОНТЕНТ -->
    <main id="mainContent"></main>

    <!-- НИЖНЯЯ НАВИГАЦИЯ -->
    <div class="bottom-nav">
        <a class="nav-item active" data-page="catalog">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Маркет</span>
        </a>
        <a class="nav-item" data-page="inventory">
            <span class="nav-icon">⭐</span>
            <span class="nav-label">Инвентарь</span>
        </a>
        <a class="nav-item" data-page="profile">
            <span class="nav-icon">👤</span>
            <span class="nav-label">Профиль</span>
        </a>
    </div>

    <!-- МОДАЛКА -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">✕</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>

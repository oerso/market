<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Market</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- HEADER -->
    <div class="header">
        <div class="logo">⚡ MARKET</div>
        <div class="header-right">
            <div class="balance" id="headerBalance">💰 0 ₽</div>
            <button class="menu-btn" id="menuBtn">⋮</button>
        </div>
    </div>

    <!-- МЕНЮ 3 ТОЧКИ -->
    <div class="side-menu" id="sideMenu">
        <div class="side-menu-header">Меню</div>
        <a class="side-item" data-page="support">🆘 Тех. поддержка</a>
        <a class="side-item" data-page="faq">❓ FAQ</a>
        <a class="side-item" data-page="reviews">⭐ Отзывы</a>
        <a class="side-item" data-page="chat">💬 Чат</a>
        <a class="side-item" data-page="referral">👥 Рефералка</a>
        <a class="side-item" data-page="rules">📜 Правила</a>
        <a class="side-item" data-page="instructions">📖 Инструкции</a>
    </div>
    <div class="overlay" id="overlay"></div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <main id="mainContent"></main>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a class="nav-item active" data-page="catalog">🏠 Каталог</a>
        <a class="nav-item" data-page="cart">🛒 Корзина (<span id="cartCount">0</span>)</a>
        <a class="nav-item" data-page="profile">👤 Профиль</a>
    </div>

    <!-- МОДАЛКА -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">✕</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
